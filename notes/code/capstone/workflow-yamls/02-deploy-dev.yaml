name: CWVJ Deploy | DEV

on:
  # zizmor: ignore[dangerous-triggers] -- guarded below: runs only for a successful CI run of a PUSH
  # to this repository (event == 'push' and head_repository == this repo), never for fork PRs.
  workflow_run:
    workflows:
      - "CWVJ CI | Build, Scan and Publish"
    types:
      - completed
    branches:
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"

concurrency:
  group: cwvj-deploy-dev
  cancel-in-progress: false

jobs:
  deploy-to-dev-job:
    name: Deploy to DEV
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: dev

    # Audit fix: also require that CI ran for a PUSH to THIS repository. Without these checks the job is
    # only safe while CI has no pull_request trigger: adding one later would let a fork PR's successful
    # CI run start this privileged job (id-token: write) on the fork's code (workflow_run escalation).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    permissions:
      contents: read
      id-token: write
      checks: write      # to record "deployed to DEV" on the commit (read by the PROD workflow)

    steps:
      - name: Check out deployment manifests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_EKS_DEPLOY_ROLE_ARN_DEV }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Find the published image digests
        id: images
        env:
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          SHORT_SHA="${CI_SHA::7}"

          BACKEND_DIGEST=$(aws ecr describe-images \
            --repository-name cwvj-mega-backend \
            --filter tagStatus=TAGGED \
            --query "imageDetails[?imageTags[?ends_with(@, '-${SHORT_SHA}')]].imageDigest | [0]" \
            --output json | tr -d '"')

          FRONTEND_DIGEST=$(aws ecr describe-images \
            --repository-name cwvj-mega-frontend \
            --filter tagStatus=TAGGED \
            --query "imageDetails[?imageTags[?ends_with(@, '-${SHORT_SHA}')]].imageDigest | [0]" \
            --output json | tr -d '"')

          if [[ -z "$BACKEND_DIGEST" || "$BACKEND_DIGEST" == "null" || \
                -z "$FRONTEND_DIGEST" || "$FRONTEND_DIGEST" == "null" ]]; then
            echo "Could not find both published images for commit ${CI_SHA}"
            exit 1
          fi

          # Step outputs, not $GITHUB_ENV: in a workflow_run (privileged) workflow, writing to GITHUB_ENV
          # lets a value influence the environment of EVERY later step (zizmor: github-env).
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "backend=${REGISTRY}/cwvj-mega-backend@${BACKEND_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "frontend=${REGISTRY}/cwvj-mega-frontend@${FRONTEND_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME }}" \
            --region "${{ vars.AWS_REGION }}"

      - name: Prepare DEV manifests
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
        run: |
          sed -i \
            -e "s|__BACKEND_IMAGE__|${BACKEND_IMAGE}|g" \
            -e "s|__DB_NAME__|${{ vars.DB_NAME }}|g" \
            kubernetes/dev/backend.yaml

          sed -i \
            -e "s|__FRONTEND_IMAGE__|${FRONTEND_IMAGE}|g" \
            kubernetes/dev/frontend.yaml

      - name: Deploy to DEV
        run: kubectl apply -f kubernetes/dev/

      - name: Wait for deployments
        run: |
          kubectl rollout status deployment/cwvj-backend -n dev --timeout=5m
          kubectl rollout status deployment/cwvj-frontend -n dev --timeout=5m

      - name: Show deployed resources
        run: kubectl get deployments,pods,services -n dev -o wide

      - name: Smoke test DEV frontend
        run: |
          kubectl port-forward -n dev service/cwvj-frontend 18080:80 &
          PORT_FORWARD_PID=$!
          trap 'kill "$PORT_FORWARD_PID" 2>/dev/null || true' EXIT

          curl --fail --silent --show-error \
            --retry 10 --retry-connrefused \
            --max-time 10 \
            http://127.0.0.1:18080/

      # Audit fix: record the DEV result as a CHECK RUN on the exact commit. The PROD workflow verifies it.
      # (The old proof was the commit SHA written in the PR body, which anyone with write access can edit.
      # Check runs can only be created by GitHub Apps, here the github-actions app via GITHUB_TOKEN.)
      - name: Record DEV deployment on the commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name='cwvj/deployed-to-dev' -f head_sha="$SHA" \
            -f status=completed -f conclusion=success \
            -f 'output[title]=Deployed to DEV and smoke-tested' \
            -f "output[summary]=Run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Roll back DEV on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/cwvj-backend -n dev || true
          kubectl rollout undo deployment/cwvj-frontend -n dev || true

  #Calling workflow
  create-pull-request-job:
    name: Create Pull Request
    needs: deploy-to-dev-job

    uses: ./.github/workflows/03-create-pr.yaml

    with:
      head_branch: ${{ github.event.workflow_run.head_branch }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
    permissions:
      contents: read
      pull-requests: write